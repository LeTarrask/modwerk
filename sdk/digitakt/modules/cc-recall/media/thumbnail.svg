<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">CC Recall</title><desc id="description">A MIDI track&apos;s CC values, edited away from the saved pattern, snap back to the saved levels on a reload and go straight out to MIDI OUT; the stale values are shown faint. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#79b5f8}.signal-secondary{stroke:#79b5f8;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{opacity:.8;font:10px monospace;letter-spacing:.7px}.signal-art text,.signal-dot{fill:#79b5f8;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M30 140H200" class="signal-secondary"/><rect width="14" height="78" x="40" y="62" class="signal-ghost" rx="2"/><rect width="14" height="44" x="70" y="96" class="signal-ghost" rx="2"/><rect width="14" height="86" x="100" y="54" class="signal-ghost" rx="2"/><rect width="14" height="60" x="130" y="80" class="signal-ghost" rx="2"/><rect width="14" height="36" x="40" y="104" class="signal-main" rx="2"/><rect width="14" height="70" x="70" y="70" class="signal-main" rx="2"/><rect width="14" height="22" x="100" y="118" class="signal-main" rx="2"/><rect width="14" height="48" x="130" y="92" class="signal-main" rx="2"/><path d="M176 66A26 26 0 1 1 168 90" class="signal-secondary"/><path d="M168 80L168 91L179 88" class="signal-secondary"/><path d="M214 97H286" class="signal-main"/><path d="M278 91L286 97L278 103" class="signal-main"/><circle cx="214" cy="97" r="3.5" class="signal-dot"/><text x="25" y="28">MIDI TRACK · CC VAL</text><text x="232" y="86">OUT</text><text x="160" y="124">RELOAD</text><text x="25" y="177">SEND THE SAVED VALUES</text></g></svg>