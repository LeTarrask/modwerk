<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Input Pre-Fader Sends</title><desc id="description">The external inputs split before their level fader: the main path runs through LEV to the mains, the send path goes straight to the delay and reverb. The stock post-fader tap is shown faint. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{opacity:.8;font:10px monospace;letter-spacing:.7px}.signal-art text,.signal-dot{fill:#9eb4ed;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M30 72H150" class="signal-main"/><rect width="40" height="20" x="150" y="62" class="signal-main" rx="3"/><path d="M162 76V68M170 76V66M178 76V70" class="signal-secondary"/><path d="M190 72H290" class="signal-main"/><path d="M282 66L290 72L282 78" class="signal-main"/><circle cx="96" cy="72" r="3.5" class="signal-dot"/><path d="M96 72V128H150" class="signal-main"/><circle cx="150" cy="128" r="3" class="signal-dot"/><path d="M150 128V112H250M150 128V144H250" class="signal-secondary"/><path d="M243 106L250 112L243 118M243 138L250 144L243 150" class="signal-secondary"/><path stroke-dasharray="3 5" d="M220 72V100" class="signal-ghost"/><text x="25" y="28">IN L · IN R</text><text x="152" y="52">LEV</text><text x="252" y="58">MAIN</text><text x="104" y="122">PRE</text><text x="256" y="116">DEL</text><text x="256" y="148">REV</text><text x="25" y="177">SEND BEFORE LEV · INPUTS ONLY</text></g></svg>