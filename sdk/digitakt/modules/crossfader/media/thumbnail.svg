<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Crossfader</title><desc id="description">Two groups of tracks, A and B, each with an equal-power gain curve, meeting at a crossfader whose handle sits between them. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{opacity:.8;font:10px monospace;letter-spacing:.7px}.signal-art text,.signal-dot{fill:#9eb4ed;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M40 60H60M40 72H60M40 84H60" class="signal-secondary"/><path d="M40 110H60M40 122H60M40 134H60" class="signal-secondary"/><path d="M60 72H96L130 92" class="signal-secondary"/><path d="M60 122H96L130 102" class="signal-secondary"/><path d="M150 64C190 64 222 78 270 128" class="signal-main"/><path d="M150 128C190 128 222 114 270 64" class="signal-ghost"/><path d="M150 154H270" class="signal-main"/><rect width="10" height="16" x="204" y="146" class="signal-main" rx="2"/><circle cx="130" cy="97" r="3.5" class="signal-dot"/><text x="25" y="52">A</text><text x="25" y="150">B</text><text x="148" y="56">A</text><text x="262" y="56">B</text><text x="25" y="182">GROUPS · EQUAL-POWER FADE · LEVEL</text></g></svg>