<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Live Looper</title><desc id="description">A step grid with one loop&apos;s length bracketed, captured into a loop that keeps playing across a pattern change. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{opacity:.8;font:10px monospace;letter-spacing:.7px}.signal-art text,.signal-dot{fill:#9eb4ed;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M30 64V72M44 64V72M58 64V72M72 64V72M86 64V72M100 64V72M114 64V72M128 64V72M142 64V72M156 64V72M170 64V72M184 64V72" class="signal-ghost"/><path d="M58 64V76M86 64V76M114 64V76M142 64V76" class="signal-secondary"/><path d="M58 82H142M58 78V86M142 78V86" class="signal-main"/><path d="M100 86V104" class="signal-main"/><path d="M76 128A26 16 0 1 0 76 127" class="signal-main"/><path d="M70 122L76 128L82 122" class="signal-main"/><circle cx="128" cy="128" r="3.5" class="signal-dot"/><path d="M128 128H290" class="signal-secondary"/><path stroke-dasharray="3 5" d="M200 112V146" class="signal-ghost"/><text x="25" y="44">STEPS · CAPTURE</text><text x="80" y="160">LOOP</text><text x="150" y="108">PTN A</text><text x="216" y="108">PTN B</text><text x="25" y="182">ONE TRACK · PLAYS THROUGH PATTERN CHANGES</text></g></svg>