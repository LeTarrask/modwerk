<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Play Start  PLAY always starts</title><desc id="description">A conceptual diagram: stock PLAY pauses on a second press; PLAY START ON restarts from the beginning. It is not a measured screen.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#7ec8e3}.signal-ghost{opacity:.2;stroke-width:1.3}.rhythm-on,.signal-dot{fill:#7ec8e3}.rhythm-off{stroke:#7ec8e3;fill:#2c2837;opacity:.4}.signal-art text{fill:#7ec8e3;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><text x="28" y="44">OFF</text><rect width="40" height="22" x="28" y="54" class="rhythm-off" rx="4"/><text x="48" y="69" text-anchor="middle">PLAY</text><path d="M78 65H118" class="signal-ghost"/><circle cx="140" cy="65" r="5" class="rhythm-off"/><text x="158" y="69">PAUSE</text><text x="28" y="118">ON</text><rect width="40" height="22" x="28" y="128" class="rhythm-on" rx="4"/><text x="48" y="143" text-anchor="middle">PLAY</text><path d="M78 139H118M112 134L118 139L112 144" class="signal-main"/><path d="M140 128V150" class="signal-main"/><circle cx="140" cy="128" r="4" class="signal-dot"/><text x="158" y="143">START</text><text x="28" y="177">PLAY START</text><text x="210" y="177">NEVER PAUSE</text></g></svg>