<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Arr Rows — select, copy and paste arrangement rows</title><desc id="description">Arrangement rows as short lines; three of them marked and bracketed on the left, carried by an arrow into a second column where they replace one row and the rows below move down. An illustration, not an Octatrack screenshot.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#b5a0ff}.signal-secondary{stroke:#b5a0ff;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-dot{fill:#b5a0ff}.signal-art text{fill:#b5a0ff;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}.signal-secondary{opacity:.65}</style><rect width="320" height="192" fill="#232328"/><path d="M0 52H320M0 97H320M0 142H320M64 0V192M128 0V192M192 0V192M256 0V192" class="signal-grid"/><path d="M40 34H112" class="signal-ghost"/><circle cx="32" cy="34" r="2.2" class="signal-ghost"/><path d="M40 50H112" class="signal-ghost"/><circle cx="32" cy="50" r="2.2" class="signal-ghost"/><path d="M40 66H112" class="signal-main"/><circle cx="32" cy="66" r="2.2" class="signal-dot"/><path d="M40 82H112" class="signal-main"/><circle cx="32" cy="82" r="2.2" class="signal-dot"/><path d="M40 98H112" class="signal-main"/><circle cx="32" cy="98" r="2.2" class="signal-dot"/><path d="M40 114H112" class="signal-ghost"/><circle cx="32" cy="114" r="2.2" class="signal-ghost"/><path d="M40 130H112" class="signal-ghost"/><circle cx="32" cy="130" r="2.2" class="signal-ghost"/><path d="M120 62V102M120 62H116M120 102H116" class="signal-secondary"/><path d="M124 82C160 82 168 66 196 66" class="signal-main"/><path d="M190 61L197 66L190 71" class="signal-main"/><path d="M208 34H280" class="signal-ghost"/><path d="M208 50H280" class="signal-ghost"/><path d="M208 66H280" class="signal-main"/><path d="M208 82H280" class="signal-main"/><path d="M208 98H280" class="signal-main"/><path d="M208 114H280" class="signal-secondary"/><path d="M208 130H280" class="signal-secondary"/><path d="M208 146H280" class="signal-secondary"/><path d="M288 50V146" class="signal-ghost"/><text x="160" y="176" text-anchor="middle">SELECT, COPY AND PASTE ARRANGER ROWS</text></svg>