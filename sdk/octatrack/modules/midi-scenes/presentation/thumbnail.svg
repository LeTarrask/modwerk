<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">MIDI Scenes — scene locks on the MIDI tracks</title><desc id="description">Eight MIDI track lanes run from their scene A lock to their scene B lock; at the crossfader position each lane&apos;s blended value is read and sent out as a CC.</desc><style>.signal-art{width:100%;height:calc(100% - 55px);overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#83c7bc}.signal-secondary{stroke:#83c7bc;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-dot{fill:#83c7bc}.signal-art text{fill:#83c7bc;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M60 44 L236 66" class="signal-ghost"/><circle cx="60" cy="44" r="3" class="signal-secondary"/><circle cx="236" cy="66" r="3" class="signal-secondary"/><circle cx="176" cy="58.5" r="2.6" class="signal-dot"/><path d="M60 62 L236 46" class="signal-ghost"/><circle cx="60" cy="62" r="3" class="signal-secondary"/><circle cx="236" cy="46" r="3" class="signal-secondary"/><circle cx="176" cy="51.5" r="2.6" class="signal-dot"/><path d="M60 52 L236 84" class="signal-ghost"/><circle cx="60" cy="52" r="3" class="signal-secondary"/><circle cx="236" cy="84" r="3" class="signal-secondary"/><circle cx="176" cy="73.1" r="2.6" class="signal-dot"/><path d="M60 80 L236 58" class="signal-ghost"/><circle cx="60" cy="80" r="3" class="signal-secondary"/><circle cx="236" cy="58" r="3" class="signal-secondary"/><circle cx="176" cy="65.5" r="2.6" class="signal-dot"/><path d="M60 70 L236 104" class="signal-ghost"/><circle cx="60" cy="70" r="3" class="signal-secondary"/><circle cx="236" cy="104" r="3" class="signal-secondary"/><circle cx="176" cy="92.4" r="2.6" class="signal-dot"/><path d="M60 96 L236 74" class="signal-ghost"/><circle cx="60" cy="96" r="3" class="signal-secondary"/><circle cx="236" cy="74" r="3" class="signal-secondary"/><circle cx="176" cy="81.5" r="2.6" class="signal-dot"/><path d="M60 88 L236 122" class="signal-ghost"/><circle cx="60" cy="88" r="3" class="signal-secondary"/><circle cx="236" cy="122" r="3" class="signal-secondary"/><circle cx="176" cy="110.4" r="2.6" class="signal-dot"/><path d="M60 118 L236 100" class="signal-ghost"/><circle cx="60" cy="118" r="3" class="signal-secondary"/><circle cx="236" cy="100" r="3" class="signal-secondary"/><circle cx="176" cy="106.1" r="2.6" class="signal-dot"/><path stroke-dasharray="3 5" d="M176 30V134" class="signal-secondary"/><path d="M176 140V152H268" class="signal-main"/><path d="M262 147L268 152L262 157" class="signal-main"/><text x="162" y="24">XFADE</text><text x="25" y="177">SCENE A</text><text x="214" y="177">SCENE B</text><text x="274" y="156">CC</text></g></svg>