<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Output Matrix — the headphone jack as a third output</title><desc id="description">A conceptual diagram: eight tracks on the left, each routed to one or more of three output pairs on the right, MAIN, CUE and PHONES, the headphone jack.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#b5a0ff}.signal-secondary{stroke:#b5a0ff;stroke-width:1.7}.signal-dot{fill:#b5a0ff}.signal-art text{fill:#b5a0ff;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.reel-outline{fill:rgba(181,160,255,.06);stroke:#b5a0ff;opacity:.8;stroke-width:1.4}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}.signal-secondary{opacity:.65}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 30H300"/><path d="M20 172H300"/><path d="M96 24V176"/><path d="M200 24V176"/></g><g><circle cx="52" cy="38" r="2.6" class="signal-dot"/><text x="26" y="41">T1</text><path d="M55 38.0 C 140 38.0, 170 56, 250 56" class="signal-secondary"/><circle cx="52" cy="54.5" r="2.6" class="signal-dot"/><text x="26" y="57.5">T2</text><path d="M55 54.5 C 140 54.5, 170 56, 250 56" class="signal-secondary"/><circle cx="52" cy="71" r="2.6" class="signal-dot"/><text x="26" y="74">T3</text><path d="M55 71.0 C 140 71.0, 170 56, 250 56" class="signal-secondary"/><path d="M55 71.0 C 140 71.0, 170 98, 250 98" class="signal-secondary"/><circle cx="52" cy="87.5" r="2.6" class="signal-dot"/><text x="26" y="90.5">T4</text><path d="M55 87.5 C 140 87.5, 170 98, 250 98" class="signal-secondary"/><circle cx="52" cy="104" r="2.6" class="signal-dot"/><text x="26" y="107">T5</text><path d="M55 104.0 C 140 104.0, 170 140, 250 140" class="signal-main"/><circle cx="52" cy="120.5" r="2.6" class="signal-dot"/><text x="26" y="123.5">T6</text><path d="M55 120.5 C 140 120.5, 170 140, 250 140" class="signal-main"/><circle cx="52" cy="137" r="2.6" class="signal-dot"/><text x="26" y="140">T7</text><path d="M55 137.0 C 140 137.0, 170 56, 250 56" class="signal-secondary"/><path d="M55 137.0 C 140 137.0, 170 140, 250 140" class="signal-main"/><circle cx="52" cy="153.5" r="2.6" class="signal-dot"/><text x="26" y="156.5">T8</text><path d="M55 153.5 C 140 153.5, 170 98, 250 98" class="signal-secondary"/><path d="M55 153.5 C 140 153.5, 170 140, 250 140" class="signal-main"/><rect width="52" height="22" x="250" y="45" class="reel-outline" rx="4"/><text x="263.6" y="59.5">MAIN</text><rect width="52" height="22" x="250" y="87" class="reel-outline" rx="4"/><text x="266.7" y="101.5">CUE</text><rect width="52" height="22" x="250" y="129" class="reel-outline" rx="4"/><text x="257.4" y="143.5">PHONES</text><path d="M262 122 a14 12 0 0 1 28 0" class="signal-main"/><rect width="5" height="8" x="259" y="120" class="signal-dot" rx="1.5"/><rect width="5" height="8" x="288" y="120" class="signal-dot" rx="1.5"/><text x="26" y="186">PER-TRACK ROUTING</text></g></svg>