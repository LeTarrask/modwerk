<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Apply Scene — scene locks into the Part</title><desc id="description">A conceptual diagram: lock values on scene A and scene B are joined by morph lines; at the crossfader position the blended values drop into the Part, and either scene&apos;s own values can be written there too.</desc><style>.signal-art{width:100%;height:calc(100% - 55px);overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#83c7bc}.signal-secondary{stroke:#83c7bc;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-dot{fill:#83c7bc}.signal-art text{fill:#83c7bc;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M48 40L272 92" class="signal-ghost"/><path d="M48 70L272 48" class="signal-ghost"/><path d="M48 104L272 66" class="signal-ghost"/><path d="M48 58L272 112" class="signal-ghost"/><path stroke-dasharray="3 5" d="M184 30V132" class="signal-secondary"/><circle cx="48" cy="40" r="3.5" class="signal-secondary"/><circle cx="272" cy="92" r="3.5" class="signal-secondary"/><circle cx="184" cy="71.6" r="3" class="signal-dot"/><circle cx="48" cy="70" r="3.5" class="signal-secondary"/><circle cx="272" cy="48" r="3.5" class="signal-secondary"/><circle cx="184" cy="56.6" r="3" class="signal-dot"/><circle cx="48" cy="104" r="3.5" class="signal-secondary"/><circle cx="272" cy="66" r="3.5" class="signal-secondary"/><circle cx="184" cy="80.9" r="3" class="signal-dot"/><circle cx="48" cy="58" r="3.5" class="signal-secondary"/><circle cx="272" cy="112" r="3.5" class="signal-secondary"/><circle cx="184" cy="90.8" r="3" class="signal-dot"/><path d="M184 134V144M180 140L184 144L188 140" class="signal-secondary"/><path d="M64 150H256" class="signal-main"/><path d="M96 146V154" class="signal-main"/><path d="M128 146V154" class="signal-main"/><path d="M160 146V154" class="signal-main"/><path d="M192 146V154" class="signal-main"/><path d="M224 146V154" class="signal-main"/><text x="170" y="24">XFADE</text><text x="25" y="177">SCENE A</text><text x="139" y="177">PART</text><text x="243" y="177">SCENE B</text></g></svg>