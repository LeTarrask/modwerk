<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Direct Jump — the cued pattern takes over on the next step</title><desc id="description">A conceptual diagram: pattern A01 plays; a pattern cued with PTN and a trig key takes over on the next step, at the position it would have reached since START, instead of at the end of A01 as on the stock OS. It illustrates the timing, not a measured screen.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#b5a0ff}.signal-secondary{stroke:#b5a0ff;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.rhythm-on{fill:#b5a0ff}.rhythm-off{stroke:#b5a0ff;fill:#2c2837;opacity:.4}.signal-art text{fill:#b5a0ff;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}.signal-secondary{opacity:.65}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><text x="44" y="60" text-anchor="end">A01</text><rect width="10" height="10" x="52" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="67" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="82" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="97" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="112" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="127" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="142" y="52" class="rhythm-on" rx="2"/><rect width="10" height="10" x="157" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="172" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="187" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="202" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="217" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="232" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="247" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="262" y="52" class="rhythm-off" rx="2"/><rect width="10" height="10" x="277" y="52" class="rhythm-off" rx="2"/><text x="44" y="130" text-anchor="end">A02</text><rect width="10" height="10" x="52" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="67" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="82" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="97" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="112" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="127" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="142" y="122" class="rhythm-off" rx="2"/><rect width="10" height="10" x="157" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="172" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="187" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="202" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="217" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="232" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="247" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="262" y="122" class="rhythm-on" rx="2"/><rect width="10" height="10" x="277" y="122" class="rhythm-on" rx="2"/><path d="M147 34V48" class="signal-secondary"/><text x="147" y="30" text-anchor="middle">CUE</text><path d="M147 64C147 92 162 96 162 118M156 111L162 118L167 112" class="signal-main"/><text x="172" y="96">NEXT STEP</text><path stroke-dasharray="3 5" d="M289 58H297V146H289" class="signal-ghost"/><text x="297" y="160" text-anchor="end">STOCK: PATTERN END</text><text x="25" y="182">PTN + YES</text><text x="300" y="182" text-anchor="end">CLOCK-LOCKED</text></g></svg>