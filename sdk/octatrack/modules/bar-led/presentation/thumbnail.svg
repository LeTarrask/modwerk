<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Bar LED green on the pattern&apos;s 1</title><desc id="description">A conceptual diagram: two passes of a pattern&apos;s beat flashes; the first flash of each pass is green, the others red. It is not a measured screen.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#7ec8e3}.signal-main{stroke-width:2.3}.signal-ghost{opacity:.2;stroke-width:1.3}.beat-one{fill:#6fd27a}.beat{fill:#e36b6b;opacity:.75}.signal-art text{fill:#7ec8e3;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}.signal-art{height:calc(100% - 55px)}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><text x="28" y="44">TEMPO LED</text><path d="M28 97H292" class="signal-ghost"/><path d="M160 72V122" class="signal-main"/><circle cx="40" cy="97" r="9" class="beat-one"/><circle cx="70" cy="97" r="6" class="beat"/><circle cx="100" cy="97" r="6" class="beat"/><circle cx="130" cy="97" r="6" class="beat"/><circle cx="190" cy="97" r="9" class="beat-one"/><circle cx="220" cy="97" r="6" class="beat"/><circle cx="250" cy="97" r="6" class="beat"/><circle cx="280" cy="97" r="6" class="beat"/><text x="36" y="132">1</text><text x="186" y="132">1</text><text x="28" y="177">BAR LED</text><text x="196" y="177">PATTERN&apos;S 1</text></g></svg>