<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Arp Key Locks — a key locked on single steps of a MIDI track</title><desc id="description">A conceptual diagram: sixteen steps with key locks on steps 1, 5, 9 and 13 (C minor, F Dorian, G Phrygian, C minor); one arpeggio runs on across them, its notes moving into each step&apos;s key. It illustrates the idea, not a measured screen or audio.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#83c7bc}.signal-ghost{opacity:.2;stroke-width:1.3}.rhythm-on,.signal-dot{fill:#83c7bc}.rhythm-off{stroke:#83c7bc;fill:#2c2837;opacity:.4}.signal-art text{fill:#83c7bc;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path stroke-dasharray="3 5" d="M97 40V140" class="signal-ghost"/><path stroke-dasharray="3 5" d="M157 40V140" class="signal-ghost"/><path stroke-dasharray="3 5" d="M217 40V140" class="signal-ghost"/><polyline points="45 104 60 92 75 80 90 68 105 98 120 86 135 74 150 62 165 104 180 92 195 80 210 68 225 98 240 86 255 74 270 62" class="signal-main"/><circle cx="45" cy="104" r="2.6" class="signal-dot"/><circle cx="60" cy="92" r="2.6" class="signal-dot"/><circle cx="75" cy="80" r="2.6" class="signal-dot"/><circle cx="90" cy="68" r="2.6" class="signal-dot"/><circle cx="105" cy="98" r="2.6" class="signal-dot"/><circle cx="120" cy="86" r="2.6" class="signal-dot"/><circle cx="135" cy="74" r="2.6" class="signal-dot"/><circle cx="150" cy="62" r="2.6" class="signal-dot"/><circle cx="165" cy="104" r="2.6" class="signal-dot"/><circle cx="180" cy="92" r="2.6" class="signal-dot"/><circle cx="195" cy="80" r="2.6" class="signal-dot"/><circle cx="210" cy="68" r="2.6" class="signal-dot"/><circle cx="225" cy="98" r="2.6" class="signal-dot"/><circle cx="240" cy="86" r="2.6" class="signal-dot"/><circle cx="255" cy="74" r="2.6" class="signal-dot"/><circle cx="270" cy="62" r="2.6" class="signal-dot"/><rect width="10" height="10" x="40" y="124" class="rhythm-on" rx="2"/><rect width="10" height="10" x="55" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="70" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="85" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="100" y="124" class="rhythm-on" rx="2"/><rect width="10" height="10" x="115" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="130" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="145" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="160" y="124" class="rhythm-on" rx="2"/><rect width="10" height="10" x="175" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="190" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="205" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="220" y="124" class="rhythm-on" rx="2"/><rect width="10" height="10" x="235" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="250" y="124" class="rhythm-off" rx="2"/><rect width="10" height="10" x="265" y="124" class="rhythm-off" rx="2"/><text x="68" y="152" text-anchor="middle">C MIN</text><text x="128" y="152" text-anchor="middle">F DOR</text><text x="188" y="152" text-anchor="middle">G PHR</text><text x="248" y="152" text-anchor="middle">C MIN</text><text x="25" y="182">TRIG + KEY</text><text x="300" y="182" text-anchor="end">ARP KEEPS RUNNING</text><text x="25" y="30">LOCKED KEY PER STEP</text></g></svg>