<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" fill="none" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Quantize Live Rec Toggle — show, then invert</title><desc id="description">A conceptual diagram: holding REC and tapping PLAY shows the live-record quantize setting in a toast, and tapping PLAY again while it is up inverts it. It illustrates the gesture, not a measured screen.</desc><style>.signal-art{width:100%;overflow:visible;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#b5a0ff}.signal-secondary{stroke:#b5a0ff;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.rhythm-on{fill:#b5a0ff}.rhythm-off{stroke:#b5a0ff;fill:#2c2837;opacity:.4}.signal-art text{fill:#b5a0ff;font:8px monospace;letter-spacing:.7px;stroke:none;opacity:.8;font-size:10px}.signal-art{height:calc(100% - 55px)}.signal-main{stroke-width:2.7}.signal-secondary{opacity:.65}</style><rect width="320" height="192" fill="#1c1c22"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><rect width="34" height="22" x="28" y="46" class="rhythm-on" rx="4"/><text x="45" y="83" text-anchor="middle">REC</text><text x="45" y="39" text-anchor="middle">HOLD</text><rect width="34" height="22" x="74" y="46" class="rhythm-off" rx="4"/><text x="91" y="83" text-anchor="middle">PLAY</text><text x="91" y="39" text-anchor="middle">TAP</text><path d="M114 57H138M132 52L138 57L132 62" class="signal-secondary"/><rect width="158" height="26" x="144" y="44" class="signal-secondary" rx="2"/><text x="223" y="61" text-anchor="middle">LIVE REC: QUANTIZED</text><rect width="34" height="22" x="28" y="116" class="rhythm-on" rx="4"/><text x="45" y="153" text-anchor="middle">REC</text><text x="45" y="109" text-anchor="middle">HOLD</text><rect width="34" height="22" x="74" y="116" class="rhythm-off" rx="4"/><text x="91" y="153" text-anchor="middle">PLAY</text><text x="91" y="109" text-anchor="middle">AGAIN</text><path d="M114 127H138M132 122L138 127L132 132" class="signal-main"/><rect width="158" height="26" x="144" y="114" class="signal-main" rx="2"/><text x="223" y="131" text-anchor="middle">LIVE REC: UNQUANTIZED</text><path stroke-dasharray="3 5" d="M223 74V110M218 104L223 110L228 104" class="signal-ghost"/><text x="25" y="177">SHOW</text><text x="212" y="177">THEN INVERT</text></g></svg>