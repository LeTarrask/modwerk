<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">Spectrum</title><desc id="description">A live spectrum analyzer on the pedal screen, 40 Hz to 16 kHz, with peak hold. Original conceptual illustration, not a pedal screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#79b5f8;stroke-width:2.7}.signal-secondary{stroke:#79b5f8;opacity:.65;stroke-width:1.7}.signal-art text{opacity:.8;font:10px monospace;letter-spacing:.7px}.signal-art text,.signal-dot{fill:#79b5f8;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><path d="M48 150V120" class="signal-main"/><circle cx="48" cy="110" r="2" class="signal-dot"/><path d="M60 150V98" class="signal-secondary"/><circle cx="60" cy="88" r="2" class="signal-dot"/><path d="M72 150V76" class="signal-secondary"/><circle cx="72" cy="66" r="2" class="signal-dot"/><path d="M84 150V62" class="signal-main"/><circle cx="84" cy="52" r="2" class="signal-dot"/><path d="M96 150V80" class="signal-secondary"/><circle cx="96" cy="70" r="2" class="signal-dot"/><path d="M108 150V90" class="signal-secondary"/><circle cx="108" cy="80" r="2" class="signal-dot"/><path d="M120 150V72" class="signal-main"/><circle cx="120" cy="62" r="2" class="signal-dot"/><path d="M132 150V96" class="signal-secondary"/><circle cx="132" cy="86" r="2" class="signal-dot"/><path d="M144 150V110" class="signal-secondary"/><circle cx="144" cy="100" r="2" class="signal-dot"/><path d="M156 150V104" class="signal-main"/><circle cx="156" cy="94" r="2" class="signal-dot"/><path d="M168 150V120" class="signal-secondary"/><circle cx="168" cy="110" r