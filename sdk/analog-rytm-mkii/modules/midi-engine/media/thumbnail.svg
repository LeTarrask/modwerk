<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">MIDI ENGINE</title><desc id="description">A track&apos;s trigs drawn as steps, each sending a three-note chord to an external synth over MIDI, with a CC lane changing at a lock and at a lock trig without a note. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M40 108H280" class="signal-ghost"/><path d="M40 92H64M40 80H64M40 68H64" class="signal-main"/><path d="M100 92H124M100 80H124M100 68H124" class="signal-main"/><path d="M160 92H184M160 80H184M160 68H184" class="signal-main"/><path d="M220 92H280M220 80H280M220 68H280" class="signal-main"/><path d="M40 140H70V126H130V140H160V120H190V140H280" class="signal-secondary"/><path stroke-dasharray="3 5" d="M70 112V160" class="signal-secondary"/><path stroke-dasharray="2 4" d="M70 92H94M70 80H94M70 68H94" class="signal-ghost"/><text x="40" y="44">TRIG +7 +12</text><text x="280" y="44" text-anchor="end">CH 1</text><text x="40" y="176">CC 74</text><text x="70" y="176">LOCK TRIG</text><text x="280" y="176" text-anchor="end">MIDI OUT</text></g></svg>