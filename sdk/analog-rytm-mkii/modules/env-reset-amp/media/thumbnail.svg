<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">ENV RESET AMP</title><desc id="description">SOUND SETTINGS ENV RESET gains AMP and AMP+FILT: the amp envelope restarts from silence on every trig, so AMP ATK is heard on every hit. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke:#9ad38a;stroke-width:2.7}.signal-secondary{stroke:#9ad38a;opacity:.65;stroke-width:1.7}.signal-art text{fill:#9ad38a;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M40 150L54 70L100 140" class="signal-main"/><path d="M40 150V158" class="signal-secondary"/><path d="M104 150L118 70L164 140" class="signal-main"/><path d="M104 150V158" class="signal-secondary"/><path d="M168 150L182 70L228 140" class="signal-main"/><path d="M168 150V158" class="signal-secondary"/><path d="M232 150L246 70L292 140" class="signal-main"/><path d="M232 150V158" class="signal-secondary"/><text x="30" y="40">ENV RESET: AMP</text></g></svg>