<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">WAVEFOLDER</title><desc id="description">A wavefolder on the Rytm&apos;s send bus: past full level the sound folds back in, more as you push it, and the folds follow each hit&apos;s strength. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-main{stroke-width:2.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M40 97C80 37 120 37 160 97S240 157 280 97" class="signal-ghost"/><path d="M40 97L70 50L85 75L100 50L130 97L160 144L175 119L190 144L220 97L250 50L265 75L280 60" class="signal-main"/><text x="40" y="44">FOLD</text><text x="280" y="44" text-anchor="end">DYN</text><text x="40" y="176">SINE</text><text x="280" y="176" text-anchor="end">TRIANGLE</text></g></svg>