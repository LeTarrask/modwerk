<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">SAMPLE PLAYBACK RATE</title><desc id="description">A sample&apos;s play position over time: it climbs at full speed, slows to a stop as RATE reaches 64, then runs backward. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-main{stroke-width:2.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M40 148H280M40 58H280" class="signal-ghost"/><path d="M40 148L104 92C124 72 142 62 160 60C178 62 196 72 216 92L280 148" class="signal-main"/><path stroke-dasharray="3 5" d="M160 60V148" class="signal-ghost"/><text x="40" y="44">RATE 127</text><text x="160" y="44" text-anchor="middle">64</text><text x="280" y="44" text-anchor="end">0</text><text x="40" y="164">1X</text><text x="160" y="164" text-anchor="middle">STOP</text><text x="280" y="164" text-anchor="end">-1X</text></g></svg>