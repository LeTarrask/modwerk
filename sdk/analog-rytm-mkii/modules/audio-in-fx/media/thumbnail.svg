<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">AUDIO IN ROUTING</title><desc id="description">AUDIO IN takes two parallel paths. Knob D (STE) adds it to the drums&apos; analog mix ahead of DIST and COMP, then the output. Knob E (IFX) feeds the delay and the reverb at one level; their returns rejoin before DIST (PRE) or at the output (POST), as stock&apos;s DEL and REV set. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#9eb4ed}.signal-secondary{stroke:#9eb4ed;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{fill:#9eb4ed;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><path d="M138 34V50" class="signal-ghost"/><text x="138" y="28" text-anchor="middle">DRUMS</text><path d="M40 97H60C76 97 76 58 92 58H130" class="signal-main"/><circle cx="138" cy="58" r="8" class="signal-main"/><path d="M134 58H142M138 54V62" class="signal-main"/><path d="M146 58H162M202 58H214M254 58H272" class="signal-main"/><rect width="40" height="20" x="162" y="48" class="signal-main" rx="2"/><text x="182" y="62" text-anchor="middle">DIST</text><rect width="40" height="20" x="214" y="48" class="signal-main" rx="2"/><text x="234" y="62" text-anchor="middle">COMP</text><text x="276" y="62">OUT</text><path d="M60 97C76 97 76 137 92 137H118C130 137 130 124 150 124M118 137C130 137 130 150 150 150" class="signal-secondary"/><rect width="52" height="20" x="150" y="114" class="signal-secondary" rx="2"/><text x="176" y="128" text-anchor="middle">DELAY</text><rect width="52" height="20" x="150" y="140" class="signal-secondary" rx="2"/><text x="176" y="154" text-anchor="middle">REVERB</text><path stroke-dasharray="3 5" d="M202 124C214 124 214 137 226 137M202 150C214 150 214 137 226 137V96M154 96H266M154 96V66M266 96V58" class="signal-ghost"/><text x="160" y="90">PRE</text><text x="262" y="90" text-anchor="end">POST</text><text x="20" y="101">IN</text><text x="86" y="48">D STE</text><text x="86" y="156">E IFX</text></g></svg>