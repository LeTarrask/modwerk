<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-labelledby="title description" class="signal-art" role="img" viewBox="0 0 320 192"><title id="title">SILENT PAD+TRIG</title><desc id="description">Twelve pads in two rows. A tapped pad is marked as the selected track and its output stays flat; with FUNC held the same pad sends a hit. Original conceptual illustration, not an instrument screen or a measured result.</desc><style>.signal-grid{stroke:#fff;opacity:.035;stroke-width:.7}.signal-main{stroke-width:2.7}.signal-ghost,.signal-main{stroke:#b5a0ff}.signal-secondary{stroke:#b5a0ff;opacity:.65;stroke-width:1.7}.signal-ghost{opacity:.2;stroke-width:1.3}.signal-art text{fill:#b5a0ff;opacity:.8;font:10px monospace;letter-spacing:.7px;stroke:none}</style><rect width="320" height="192" fill="#232328"/><g class="signal-grid"><path d="M20 52H300"/><path d="M20 97H300"/><path d="M20 142H300"/><path d="M64 33V163"/><path d="M128 33V163"/><path d="M192 33V163"/><path d="M256 33V163"/></g><g><g class="signal-ghost"><rect width="16" height="16" x="36" y="58" rx="2"/><rect width="16" height="16" x="56" y="58" rx="2"/><rect width="16" height="16" x="96" y="58" rx="2"/><rect width="16" height="16" x="116" y="58" rx="2"/><rect width="16" height="16" x="136" y="58" rx="2"/><rect width="16" height="16" x="36" y="78" rx="2"/><rect width="16" height="16" x="56" y="78" rx="2"/><rect width="16" height="16" x="76" y="78" rx="2"/><rect width="16" height="16" x="96" y="78" rx="2"/><rect width="16" height="16" x="116" y="78" rx="2"/><rect width="16" height="16" x="136" y="78" rx="2"/></g><rect width="16" height="16" x="76" y="58" class="signal-main" rx="2"/><path stroke-dasharray="3 5" d="M84 98V116" class="signal-secondary"/><path d="M36 128H152" class="signal-main"/><text x="36" y="44">TAP: SEL TRK 3</text><text x="36" y="152">SILENT</text><rect width="34" height="16" x="192" y="58" class="signal-secondary" rx="2